name: Flat Data

# One hourly run at minute 17 UTC. ARANIX is fetched every time.
# TRON is fetched in that same run only when the UTC hour is 2 (10:17 Beijing).
# GitHub cron is best-effort and may start late.
#
# This job only fetches. It commits data files when a Kickstarter observation was
# accepted or Frankfurter rate/date actually changed. It then pushes that commit
# to main and only afterwards builds and deploys GitHub Pages.
# GITHUB_TOKEN pushes do not start the CI workflow, so Pages cannot wait for a
# second workflow. Deploy stays in this workflow, after origin/main matches HEAD.
# Failure, unchanged rates, and status-only records are not committed and are not deployed.
# The commit message must not contain a Cloudflare skip prefix. Cloudflare Pages
# Git integration deploys this real push on its own.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      project:
        description: 手动采集的项目。定时运行忽略此项：每小时抓 ARANIX，UTC 2 点那次同时抓 TRON。
        type: choice
        default: aranix
        options:
          - aranix
          - tron
          - both

permissions:
  contents: read

concurrency:
  group: flat-data-${{ github.repository }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'airseekers/kickstarter-dashboard'
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
    permissions:
      actions: write
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: 1.46.3

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Beijing timestamp
        id: clock
        run: |
          python3 - << 'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timezone, timedelta
          print("at=" + datetime.now(timezone(timedelta(hours=8))).strftime("%Y-%m-%dT%H:%M:%S+08:00"))
          PY

      - name: Choose projects for this trigger
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_PROJECT: ${{ inputs.project }}
        run: node --experimental-strip-types scripts/select-projects.ts

      - name: Fetch public data
        env:
          COLLECTED_AT: ${{ steps.clock.outputs.at }}
          COLLECTION_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          KICKSTARTER_FETCH_BASE: ${{ vars.KICKSTARTER_FETCH_BASE }}
          ARANIX: ${{ steps.targets.outputs.aranix }}
          TRON: ${{ steps.targets.outputs.tron }}
        run: deno run --allow-env --allow-net --allow-read --allow-write --allow-run=git deno/collect.ts

      - name: Decide whether the files should be published
        id: decide
        run: node --experimental-strip-types scripts/decide-publish.ts

      - name: Commit material data to main
        id: push
        env:
          COLLECTED_AT: ${{ steps.clock.outputs.at }}
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          if [ "${{ steps.decide.outputs.publish }}" != "true" ]; then
            echo "No material data change. Last-known-good stays. No deploy."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$REASON" = "fx_rates_changed" ]; then
            git checkout -- data/aranix data/tron data/raw || true
            git clean -fd -- data/aranix data/tron data/raw
          fi
          git add -- data
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Data: ${COLLECTED_AT} (${REASON})"
          git push origin HEAD
          git fetch origin main
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git rev-parse origin/main)"
          if [ "$local_sha" != "$remote_sha" ]; then
            echo "origin/main is $remote_sha, expected $local_sha"
            exit 1
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$local_sha" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.push.outputs.pushed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Build static site
        if: steps.push.outputs.pushed == 'true'
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        if: steps.push.outputs.pushed == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: collect
    if: needs.collect.outputs.pushed == 'true' && github.repository == 'airseekers/kickstarter-dashboard'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
