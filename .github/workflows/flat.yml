name: Flat Data

# githubocto/flat fetches public Kickstarter responses, Deno postprocess validates
# them, and the action's post step commits accepted files. Schedule is 02:00 UTC,
# which is 10:00 in Asia/Shanghai. GITHUB_TOKEN commits do not start other
# workflows, so this same workflow uploads and deploys the site after collection.
# Do not put a skip-ci marker in the data commit. Deploy runs in this workflow,
# and that marker would also suppress a later human-triggered rebuild.

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flat-data-${{ github.repository }}
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'airseekers/kickstarter-dashboard'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Setup Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282 # v2.0.4
        with:
          deno-version: 1.46.3

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Beijing timestamp
        id: clock
        run: |
          python3 - << 'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timezone, timedelta
          print("at=" + datetime.now(timezone(timedelta(hours=8))).strftime("%Y-%m-%dT%H:%M:%S+08:00"))
          PY

      - name: Fetch TRON search JSON
        id: fetch_tron_search
        continue-on-error: true
        uses: githubocto/flat@cea5ee43fce40ef71501bf5724a00d45db11641d # v3.4.0
        env:
          COLLECTED_AT: ${{ steps.clock.outputs.at }}
        with:
          http_url: https://www.kickstarter.com/projects/search.json?term=tron+360+ai+vision+robot+mower
          downloaded_filename: data/raw/tron/search.json
          axios_config: data/axios.json
          postprocess: deno/postprocess.ts

      - name: Fetch TRON project fragment
        id: fetch_tron_project
        continue-on-error: true
        uses: githubocto/flat@cea5ee43fce40ef71501bf5724a00d45db11641d # v3.4.0
        env:
          COLLECTED_AT: ${{ steps.clock.outputs.at }}
        with:
          http_url: https://www.kickstarter.com/projects/airseekers/tron-360-ai-vision-robot-mower-smooth-lawns-and-fertilizing.json
          downloaded_filename: data/raw/tron/project.json
          axios_config: data/axios.json
          postprocess: deno/postprocess.ts

      - name: Fetch TRON community page
        id: fetch_tron_community
        continue-on-error: true
        uses: githubocto/flat@cea5ee43fce40ef71501bf5724a00d45db11641d # v3.4.0
        env:
          COLLECTED_AT: ${{ steps.clock.outputs.at }}
        with:
          http_url: https://www.kickstarter.com/projects/airseekers/tron-360-ai-vision-robot-mower-smooth-lawns-and-fertilizing/community
          downloaded_filename: data/raw/tron/community.json
          axios_config: data/axios.json
          postprocess: deno/postprocess.ts

      - name: Fetch TRON FAQ page
        id: fetch_tron_faqs
        continue-on-error: true
        uses: githubocto/flat@cea5ee43fce40ef71501bf5724a00d45db11641d # v3.4.0
        env:
          COLLECTED_AT: ${{ steps.clock.outputs.at }}
        with:
          http_url: https://www.kickstarter.com/projects/airseekers/tron-360-ai-vision-robot-mower-smooth-lawns-and-fertilizing/faqs
          downloaded_filename: data/raw/tron/faqs.json
          axios_config: data/axios.json
          postprocess: deno/postprocess.ts

      - name: Fetch ARANIX search JSON
        id: fetch_aranix_search
        continue-on-error: true
        uses: githubocto/flat@cea5ee43fce40ef71501bf5724a00d45db11641d # v3.4.0
        env:
          COLLECTED_AT: ${{ steps.clock.outputs.at }}
        with:
          http_url: https://www.kickstarter.com/projects/search.json?term=ARANIX
          downloaded_filename: data/raw/aranix/search.json
          axios_config: data/axios.json
          postprocess: deno/postprocess.ts

      - name: Fetch ARANIX project fragment
        id: fetch_aranix_project
        continue-on-error: true
        uses: githubocto/flat@cea5ee43fce40ef71501bf5724a00d45db11641d # v3.4.0
        env:
          COLLECTED_AT: ${{ steps.clock.outputs.at }}
        with:
          http_url: https://www.kickstarter.com/projects/airseekers/aranix-the-worlds-first-4wd-4ws-all-terrain-robotic-mower.json
          downloaded_filename: data/raw/aranix/project.json
          axios_config: data/axios.json
          postprocess: deno/postprocess.ts

      - name: Fetch ARANIX community page
        id: fetch_aranix_community
        continue-on-error: true
        uses: githubocto/flat@cea5ee43fce40ef71501bf5724a00d45db11641d # v3.4.0
        env:
          COLLECTED_AT: ${{ steps.clock.outputs.at }}
        with:
          http_url: https://www.kickstarter.com/projects/airseekers/aranix-the-worlds-first-4wd-4ws-all-terrain-robotic-mower/community
          downloaded_filename: data/raw/aranix/community.json
          axios_config: data/axios.json
          postprocess: deno/postprocess.ts

      - name: Fetch ARANIX FAQ page
        id: fetch_aranix_faqs
        continue-on-error: true
        uses: githubocto/flat@cea5ee43fce40ef71501bf5724a00d45db11641d # v3.4.0
        env:
          COLLECTED_AT: ${{ steps.clock.outputs.at }}
        with:
          http_url: https://www.kickstarter.com/projects/airseekers/aranix-the-worlds-first-4wd-4ws-all-terrain-robotic-mower/faqs
          downloaded_filename: data/raw/aranix/faqs.json
          axios_config: data/axios.json
          postprocess: deno/postprocess.ts

      - name: Record failures without replacing last-known-good data
        if: always()
        env:
          COLLECTED_AT: ${{ steps.clock.outputs.at }}
          TRON_SEARCH_OUTCOME: ${{ steps.fetch_tron_search.outcome }}
          TRON_PROJECT_OUTCOME: ${{ steps.fetch_tron_project.outcome }}
          TRON_COMMUNITY_OUTCOME: ${{ steps.fetch_tron_community.outcome }}
          TRON_FAQS_OUTCOME: ${{ steps.fetch_tron_faqs.outcome }}
          ARANIX_SEARCH_OUTCOME: ${{ steps.fetch_aranix_search.outcome }}
          ARANIX_PROJECT_OUTCOME: ${{ steps.fetch_aranix_project.outcome }}
          ARANIX_COMMUNITY_OUTCOME: ${{ steps.fetch_aranix_community.outcome }}
          ARANIX_FAQS_OUTCOME: ${{ steps.fetch_aranix_faqs.outcome }}
        run: deno run --allow-read --allow-write deno/reconcile.ts

      - name: Stage data files
        id: stage
        if: always()
        run: |
          if git diff --cached --quiet; then
            echo "flat_staged=false" >> "$GITHUB_OUTPUT"
          else
            echo "flat_staged=true" >> "$GITHUB_OUTPUT"
          fi
          git add -A -- data
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit status when Flat did not stage a payload
        if: always() && steps.stage.outputs.flat_staged == 'false' && steps.stage.outputs.has_changes == 'true'
        env:
          COLLECTED_AT: ${{ steps.clock.outputs.at }}
        run: |
          git config user.name "flat-data"
          git config user.email "flat-data@users.noreply.github.com"
          git commit -m "Flat: source status ${COLLECTED_AT}"
          git push origin HEAD

      - name: Setup Node
        if: always() && steps.stage.outcome == 'success'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Build static site
        if: always() && steps.stage.outcome == 'success'
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact
        if: always() && steps.stage.outcome == 'success'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: collect
    if: github.repository == 'airseekers/kickstarter-dashboard'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
